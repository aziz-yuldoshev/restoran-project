{% extends 'base.html' %}

{% block title %}
{{ title }}
{% endblock title %}

{% block main %}

<style>

body{
    background:#f8f6f3;
}

.restaurant-form{

    background:white;
    max-width:750px;
    margin:60px auto;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
    border-top:6px solid #8B0000;

}

.restaurant-form h2{

    text-align:center;
    color:#8B0000;
    font-weight:bold;
    margin-bottom:30px;

}

.restaurant-form p{

    margin-bottom:18px;

}

.restaurant-form label{

    font-weight:600;
    color:#333;
    margin-bottom:8px;
    display:block;

}

.restaurant-form input,
.restaurant-form textarea,
.restaurant-form select{

    width:100%;
    border:2px solid #d4af37;
    border-radius:12px;
    padding:12px 15px;
    transition:.3s;

}

.restaurant-form textarea{

    min-height:140px;

}

.restaurant-form input:focus,
.restaurant-form textarea:focus,
.restaurant-form select:focus{

    outline:none;
    border-color:#8B0000;
    box-shadow:0 0 12px rgba(139,0,0,.2);

}

.btn-restaurant{

    background:#8B0000;
    color:white;
    border:none;
    padding:12px 35px;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    transition:.3s;

}

.btn-restaurant:hover{

    background:#d4af37;
    color:black;
    transform:translateY(-3px);

}

input[type=file]{

    padding:10px;

}

.helptext{

    font-size:13px;
    color:#777;

}

.errorlist{

    color:red;
    list-style:none;
    padding:0;
    margin-bottom:10px;

}

</style>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="restaurant-form">

                <h2>🍽 Add New Food</h2>

                <form method="post"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="text-center mt-4">

                        <button
                            type="submit"
                            class="btn-restaurant">

                            🍴 Save Food

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock main %}
