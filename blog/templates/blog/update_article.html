
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* =========================
           RESTAURANT COLORS
        ========================= */

        :root {
            --dark: #17120f;
            --dark-soft: #241914;
            --wine: #7b1e2b;
            --wine-dark: #54131d;
            --gold: #d4a24c;
            --gold-light: #f0c96b;
            --cream: #f7f1e3;
            --text: #332820;
        }


        /* =========================
           BODY
        ========================= */

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                linear-gradient(
                    rgba(23, 18, 15, 0.92),
                    rgba(23, 18, 15, 0.96)
                ),
                #17120f;

            color: var(--cream);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 15px;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .restaurant-card {
            width: 100%;
            max-width: 750px;

            background: var(--cream);

            border: 1px solid var(--gold);

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(212, 162, 76, 0.15);

            color: var(--text);

            position: relative;
        }


        /* Gold decoration */

        .restaurant-card::before {
            content: "✦";

            position: absolute;

            top: 15px;
            left: 50%;

            transform: translateX(-50%);

            color: var(--gold);

            font-size: 22px;
        }


        /* =========================
           TITLE
        ========================= */

        .restaurant-title {
            text-align: center;

            color: var(--wine);

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 35px;

            padding-top: 10px;
        }


        .restaurant-title span {
            display: block;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #8c765b;

            margin-top: 8px;
        }


        /* =========================
           FORM
        ========================= */

        form p {
            margin-bottom: 20px;
        }


        form label {
            display: block;

            font-weight: 600;

            color: var(--wine);

            margin-bottom: 7px;
        }


        form input,
        form textarea,
        form select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d8c9ae;

            border-radius: 9px;

            background: #fffdf8;

            color: var(--text);

            transition: 0.25s ease;
        }


        form input:focus,
        form textarea:focus,
        form select:focus {

            outline: none;

            border-color: var(--gold);

            box-shadow:
                0 0 0 3px rgba(212, 162, 76, 0.15);
        }


        textarea {
            min-height: 160px;

            resize: vertical;
        }


        /* =========================
           BUTTON AREA
        ========================= */

        .button-area {

            display: flex;

            gap: 12px;

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #dfd1b9;
        }


        /* SAVE BUTTON */

        .btn-save {

            background: var(--wine);

            color: white;

            border: 1px solid var(--wine);

            padding: 11px 24px;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            font-weight: 600;

            transition: 0.25s ease;
        }


        .btn-save:hover {

            background: var(--wine-dark);

            border-color: var(--wine-dark);

            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(123, 30, 43, 0.25);
        }


        /* CANCEL BUTTON */

        .btn-cancel {

            background: transparent;

            color: var(--wine);

            border: 1px solid var(--gold);

            padding: 11px 24px;

            border-radius: 8px;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-weight: 600;

            transition: 0.25s ease;
        }


        .btn-cancel:hover {

            background: var(--gold);

            color: var(--dark);

            transform: translateY(-2px);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            .restaurant-card {

                padding: 25px 20px;

            }

            .restaurant-title {

                font-size: 26px;

            }

            .button-area {

                flex-direction: column;

            }

            .btn-save,
            .btn-cancel {

                width: 100%;

                text-align: center;

            }

        }

    </style>

</head>


<body>

<div class="restaurant-card">

    <h2 class="restaurant-title">

        ✦ Edit Article

        <span>Restaurant Management</span>

    </h2>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="button-area">

            <button type="submit"
                    class="btn-save">

                💾 Save Changes

            </button>


            <a href="{% url 'article' article.id %}"
               class="btn-cancel">

                ← Cancel

            </a>

        </div>

    </form>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
