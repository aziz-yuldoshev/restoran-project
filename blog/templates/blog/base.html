
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ title|default:"Restaurant" }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            background: #f8f1e5;
            color: #3b2523;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #3b2523 !important;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #f4c95d !important;
            font-size: 25px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #ffd978 !important;
        }

        .nav-link {
            color: #fffaf2 !important;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #f4c95d !important;
        }

        .restaurant-logo {
            font-size: 28px;
            margin-right: 8px;
        }

        .main-content {
            min-height: 80vh;
        }

        footer {
            background: #3b2523;
            color: #fffaf2;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            <span class="restaurant-logo">🍽️</span>
            Aziz Restaurant
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<main class="main-content">

    {% block content %}

    {% endblock %}

</main>


<footer>

    <div>
        🍴 Aziz Restaurant
    </div>

    <small>
        Delicious food, unforgettable moments ❤️
    </small>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
