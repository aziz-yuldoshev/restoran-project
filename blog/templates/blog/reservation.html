{% extends 'base.html' %}

{% block title %}
Stol Band Qilish
{% endblock title %}

{% block main %}

<style>

.reservation-wrapper{
    min-height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 0;
    background:#f8f6f3;
}

.reservation-card{
    width:600px;
    background:white;
    padding:40px;
    border-radius:35px;
    box-shadow:0 25px 60px rgba(0,0,0,.15);
}

.reservation-title{
    text-align:center;
    color:#8B0000;
    font-weight:900;
    margin-bottom:30px;
}

.reservation-input{
    border-radius:20px;
    padding:14px;
    border:1px solid #ddd;
}

.reservation-btn{
    width:100%;
    padding:15px;
    border-radius:30px;
    background:#8B0000;
    color:white;
    font-weight:bold;
    border:none;
    transition:.3s;
}

.reservation-btn:hover{
    background:#D4AF37;
    color:#111;
}

</style>

<div class="reservation-wrapper">

    <div class="reservation-card">

        <h2 class="reservation-title">
            🍽️ Stol Band Qilish
        </h2>

        <form method="post">

            {% csrf_token %}

            <input
                class="form-control reservation-input mb-3"
                type="text"
                name="name"
                placeholder="Ismingiz"
                required>

            <input
                class="form-control reservation-input mb-3"
                type="tel"
                name="phone"
                placeholder="Telefon raqamingiz"
                required>

            <input
                class="form-control reservation-input mb-3"
                type="date"
                name="date"
                required>

            <input
                class="form-control reservation-input mb-3"
                type="time"
                name="time"
                required>

            <select
                class="form-control reservation-input mb-4"
                name="guests">

                <option>1 Kishi</option>
                <option>2 Kishi</option>
                <option>3 Kishi</option>
                <option>4 yoki undan ko‘p</option>

            </select>

            <button class="reservation-btn">
                🍴 Stolni Band Qilish
            </button>

        </form>

    </div>

</div>

{% endblock main %}
