
{% extends 'blog/base.html' %}

{% block content %}

<style>

    .delete-section {
        min-height: 80vh;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
    }


    /* Background image */

    .delete-bg {
        position: absolute;
        inset: 0;
    }

    .delete-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(45%);
    }


    /* Dark overlay */

    .delete-overlay {
        position: absolute;
        inset: 0;
        background:
            linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.85),
                rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.80)
            );
    }


    /* Content */

    .delete-content {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 650px;
        text-align: center;
        color: white;
        padding: 50px 35px;
    }


    .delete-icon {
        font-size: 65px;
        margin-bottom: 20px;
    }


    .delete-content h1 {
        font-size: 42px;
        font-weight: 700;
        margin-bottom: 15px;
        text-shadow: 0 3px 15px rgba(0,0,0,0.7);
    }


    .delete-content h2 {
        color: #f4c95d;
        font-size: 27px;
        margin-bottom: 20px;
        font-weight: 600;
    }


    .delete-content p {
        font-size: 18px;
        color: #f1f1f1;
        margin-bottom: 30px;
        line-height: 1.6;
    }


    /* Buttons */

    .delete-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }


    .delete-btn {
        background: #b52b27;
        color: white;
        border: none;
        padding: 13px 28px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
        text-decoration: none;
    }


    .delete-btn:hover {
        background: #8e1f1c;
        color: white;
        transform: translateY(-3px);
    }


    .cancel-btn {
        background: #f4c95d;
        color: #3b2523;
        border: none;
        padding: 13px 28px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
        text-decoration: none;
    }


    .cancel-btn:hover {
        background: #ffd978;
        color: #3b2523;
        transform: translateY(-3px);
    }


    /* Decorative line */

    .restaurant-line {
        width: 100px;
        height: 3px;
        background: #f4c95d;
        margin: 20px auto;
        border-radius: 10px;
    }

</style>


<section class="delete-section">


    <!-- Restaurant background -->

    <div class="delete-bg">

        <img
            src="https://uzbekistan.travel/storage/app/media/wepb/gastro_turizm/cropped-images/%D0%94%D0%B8%D0%B7%D0%B0%D0%B9%D0%BD%20%D0%B1%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F-0-0-0-0-1740051502.webp"
            alt="Restaurant Food"
        >

    </div>


    <!-- Dark overlay -->

    <div class="delete-overlay"></div>


    <!-- Delete content -->

    <div class="delete-content">


        <div class="delete-icon">
            🍽️
        </div>


        <h1>
            Delete Article
        </h1>


        <div class="restaurant-line"></div>


        <h2>
            "{{ article.title }}"
        </h2>


        <p>
            Bu restoran maqolasini o‘chirishga ishonchingiz komilmi?
            <br>
            O‘chirilgandan so‘ng ushbu maqolani qayta tiklab bo‘lmaydi.
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="delete-buttons">


                <button
                    type="submit"
                    class="delete-btn">

                    🗑️ Delete

                </button>


                <a
                    href="{% url 'article' article.id %}"
                    class="cancel-btn">

                    ← Cancel

                </a>


            </div>

        </form>


    </div>

</section>


{% endblock %}
