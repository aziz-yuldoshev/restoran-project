{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>

        {% block title %}

        {% endblock title %}

    </title>



    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">





    <style>


    /* ==========================
          GLOBAL STYLE
    ========================== */


    body{

        background:#f8f6f3;

        color:#222;

        transition:.4s;

    }




    /* ==========================
          DARK MODE
    ========================== */


    body.dark-mode{

        background:#111827;

        color:white;

    }




    body.dark-mode .card,
    body.dark-mode .info-card,
    body.dark-mode .stat-card,
    body.dark-mode .product-body,
    body.dark-mode .product-footer,
    body.dark-mode .similar-card,
    body.dark-mode .footer-card{


        background:#1f2937 !important;

        color:white;


    }




    body.dark-mode p{

        color:#d1d5db;

    }




    body.dark-mode .navbar{

        background:#111827 !important;

    }




    body.dark-mode .dropdown-menu{

        background:#1f2937;

    }




    body.dark-mode .dropdown-item{

        color:white;

    }




    body.dark-mode .dropdown-item:hover{

        background:#374151;

    }






    /* ==========================
          THEME BUTTON
    ========================== */


    .theme-btn{


        width:45px;

        height:45px;


        border:none;

        border-radius:50%;


        background:#D4AF37;


        color:#111;


        font-size:22px;


        cursor:pointer;


        transition:.3s;


        box-shadow:

        0 5px 15px rgba(0,0,0,.25);


    }




    .theme-btn:hover{


        transform:scale(1.1) rotate(15deg);


    }



    </style>



</head>




<body>





<!-- NAVBAR -->

{% include 'components/_header.html' %}







<!-- MAIN CONTENT -->


{% block main %}


{% endblock main %}








<!-- DARK LIGHT SCRIPT -->


<script>



const themeButton = document.getElementById(
    "themeToggle"
);



const body = document.body;





// Oldingi tanlovni saqlash


if(localStorage.getItem("theme") === "dark"){


    body.classList.add(
        "dark-mode"
    );


    if(themeButton){

        themeButton.innerHTML="☀️";

    }

}







// Tugma bosilganda


if(themeButton){


themeButton.addEventListener(
"click",
()=>{


    body.classList.toggle(
        "dark-mode"
    );




    if(body.classList.contains("dark-mode")){


        themeButton.innerHTML="☀️";


        localStorage.setItem(
            "theme",
            "dark"
        );


    }

    else{


        themeButton.innerHTML="🌙";


        localStorage.setItem(
            "theme",
            "light"
        );


    }



});


}



</script>






<!-- Bootstrap JS -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>

</html>

{% include 'components/_footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>




<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
