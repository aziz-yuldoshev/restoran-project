{% load static %}

<style>
    /* =======================
       RESTAURANT NAVBAR STYLE
    ======================= */

    .navbar{
        background: linear-gradient(90deg,#1b1b1b,#3b1f12,#6d1b1b);
        padding:12px 25px;
        box-shadow:0 5px 15px rgba(0,0,0,.4);
    }

    .restaurant-logo{
        width:80px;
        height:45px;
        object-fit:cover;
        border-radius:10px;
        border:2px solid #d4af37;
        margin-left:180px;
    }

    .nav-link{
        color:#fff !important;
        font-weight:600;
        margin:0 8px;
        transition:.3s;
    }

    .nav-link i{
        color:#d4af37;
    }

    .nav-link:hover{
        color:#FFD700 !important;
    }

    .restaurant-dropdown{
        background:#2b2b2b;
        border:none;
        border-radius:12px;
        overflow:hidden;
    }

    .restaurant-dropdown .dropdown-item{
        color:white;
        padding:10px 18px;
        transition:.3s;
    }

    .restaurant-dropdown .dropdown-item:hover{
        background:#8B0000;
        color:#FFD700;
    }

    .restaurant-search{
        border-radius:30px;
        border:2px solid #d4af37;
        padding-left:15px;
    }

    .restaurant-search:focus{
        border-color:#FFD700;
        box-shadow:none;
    }

    .restaurant-btn{
        background:#8B0000;
        color:white;
        border-radius:30px;
        border:none;
        padding:8px 18px;
        transition:.3s;
    }

    .restaurant-btn:hover{
        background:#d4af37;
        color:black;
    }

    .navbar-toggler{
        border:1px solid #d4af37;
    }

    .navbar-toggler:focus{
        box-shadow:none;
    }

    #navbarContent{
        justify-content:center;
    }

    #navbarContent .navbar-nav{
        margin-left:0 !important;
        margin-right:0 !important;
    }

    #navbarContent form{
        margin-left:410px !important;
    }

    .navbar-brand{
        margin-right:-200px !important;
    }
</style>

<nav class="navbar navbar-expand-lg">

    <!-- Logo -->
    <a class="navbar-brand"
       href="{% url 'index' %}">

        <img class="restaurant-logo"
             src="{% static 'blog/img/img.png' %}"
             alt="Restaurant">

    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">

        <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarContent">

        {% if request.user.is_authenticated %}

        <ul class="navbar-nav">

            <li class="nav-item">
                <a class="nav-link" href="{% url 'index' %}">
                    <i class="bi bi-house-door-fill"></i>
                    Home
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   href="{% url 'reservation' %}">

                    <i class="bi bi-calendar-check-fill"></i>

                    Reservation

                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'about' %}">
                    <i class="bi bi-info-circle-fill"></i>
                    About Us
                </a>
            </li>

            <!-- User -->
            <li class="nav-item dropdown">

                <a class="nav-link dropdown-toggle"
                   href="#"
                   data-bs-toggle="dropdown">

                    <i class="bi bi-person-circle"></i>

                    {{ request.user.username }}

                </a>

                <ul class="dropdown-menu restaurant-dropdown">

                    <li>
                        <a class="dropdown-item" href="{% url 'admin:index' %}">
                            ⚙️ Admin Panel
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="{% url 'add_article' %}">
                            🍽 Add Food
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a class="dropdown-item text-danger"
                           href="{% url 'logout' %}">
                            🚪 Logout
                        </a>
                    </li>

                </ul>

            </li>

        </ul>

        <!-- Search -->

        <form method="get"
              action="{% url 'search' %}"
              class="d-flex">

            <input
                    type="search"
                    name="q"
                    class="form-control restaurant-search"
                    placeholder="Search dishes...">

            <button class="btn restaurant-btn ms-2">

                <i class="bi bi-search"></i>

            </button>

        </form>

        {% else %}

        <ul class="navbar-nav ms-auto">

            <li class="nav-item">

                <a class="nav-link"
                   href="{% url 'login' %}">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </a>

            </li>

            <li class="nav-item">

                <a class="nav-link"
                   href="{% url 'register' %}">

                    <i class="bi bi-person-plus-fill"></i>

                    Register

                </a>

            </li>

        </ul>

        {% endif %}

    </div>

</nav>
